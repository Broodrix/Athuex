plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.athuex'
    compileSdk 34
    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "com.athuex"
        minSdk 26
        targetSdk 34
        versionCode 2111
        versionName "2.11.1"
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                // ALWAYS optimize native+llama — Debug APK must not ship unoptimized ggml
                arguments "-DANDROID_STL=c++_shared",
                          "-DANDROID_ARM_NEON=TRUE",
                          "-DATHUEX_HAS_IMGUI=ON",
                          "-DCMAKE_BUILD_TYPE=Release"
                cppFlags "-std=c++17 -O3 -DNDEBUG -fno-finite-math-only -fvisibility=hidden -fomit-frame-pointer"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        // Point at the v2.8.6 native ImGui tree (Dear ImGui + harness)
        cmake {
            path file('../../native/imgui_app/CMakeLists.txt')
            version "3.22.1"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.activity:activity-ktx:1.8.2'
}
