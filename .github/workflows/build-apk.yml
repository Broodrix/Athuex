# Athuex APK — GitHub Actions (arm64-v8a, Galaxy A06)
# Artifact: athuex-v<version-from-gradle>-debug.apk  (version auto-detected each run)
#
# History:
# - v2.9.3: setup-android@v3 failed on obsolete `tools` package → fixed with @v4
# - v2.11.0: llama.h missing because third_party/llama.cpp is gitignored → shallow-clone in CI
# - v2.11.1: full LLAMA_GIT_URL; consolidate on `main`; auto-detect versionName
#            from android/app/build.gradle(.kts); more robust APK locator.

name: build-apk

on:
  push:
    branches: [ main ]
    paths:
      - 'android/**'
      - 'native/**'
      - 'core/**'
      - 'third_party/imgui/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

env:
  JAVA_VERSION: "17"
  NDK_VERSION: "26.3.11579264"
  # Pin a known llama.cpp ref for reproducible CI (update docs/LLAMA_CPP_COMMIT.txt when changing).
  LLAMA_GIT_URL: "https://github.com/ggml-org/llama.cpp.git"
  LLAMA_GIT_REF: "master"

jobs:
  build:
    name: Build Athuex APK
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Detect project version (from android/app/build.gradle)
        id: version
        shell: bash
        run: |
          set -euo pipefail
          GRADLE_FILE=""
          for f in android/app/build.gradle.kts android/app/build.gradle; do
            if [ -f "$f" ]; then GRADLE_FILE="$f"; break; fi
          done
          if [ -z "${GRADLE_FILE}" ]; then
            echo "::error::Neither android/app/build.gradle.kts nor android/app/build.gradle was found"
            exit 1
          fi
          echo "Reading version from ${GRADLE_FILE}"
          # Match: versionName "1.2.3"   OR   versionName = "1.2.3"
          VERSION="$(grep -oE 'versionName[[:space:]]*[=]?[[:space:]]*"[^"]+"' "${GRADLE_FILE}" \
                     | head -1 | grep -oE '"[^"]+"' | head -1 | tr -d '"' || true)"
          if [ -z "${VERSION}" ]; then
            echo "::error::Could not detect a literal versionName in ${GRADLE_FILE}"
            echo "---- lines containing 'version' ----"
            grep -n 'version' "${GRADLE_FILE}" || true
            echo "Hint: keep versionName as a string literal, e.g. versionName \"2.11.1\""
            exit 1
          fi
          echo "Detected ATHUEX_VERSION=${VERSION}"
          echo "ATHUEX_VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}"       >> "$GITHUB_OUTPUT"

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-34 build-tools;34.0.0
          log-accepted-android-sdk-licenses: true

      - name: Install NDK + CMake
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f 2>/dev/null | sort | tail -1 || true)"
          if [ -z "${SDKMANAGER}" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          test -n "${SDKMANAGER}" && test -x "${SDKMANAGER}"
          echo "sdkmanager=${SDKMANAGER}"
          yes | "${SDKMANAGER}" --licenses >/dev/null 2>&1 || true
          "${SDKMANAGER}" --install "ndk;${NDK_VERSION}" "cmake;3.22.1"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=${ANDROID_HOME}" >> "$GITHUB_ENV"
          test -d "${ANDROID_HOME}/ndk/${NDK_VERSION}"

      - name: Fetch llama.cpp (required — not vendored; gitignored)
        shell: bash
        run: |
          set -euo pipefail
          if [ -f third_party/llama.cpp/include/llama.h ]; then
            echo "llama.cpp already present"
            ls third_party/llama.cpp/include/llama.h
            exit 0
          fi
          echo "Cloning ${LLAMA_GIT_URL} @ ${LLAMA_GIT_REF} → third_party/llama.cpp"
          rm -rf third_party/llama.cpp
          git clone --depth 1 --branch "${LLAMA_GIT_REF}" "${LLAMA_GIT_URL}" third_party/llama.cpp
          test -f third_party/llama.cpp/include/llama.h
          test -f third_party/llama.cpp/CMakeLists.txt
          echo "llama.cpp ready:"
          (cd third_party/llama.cpp && git rev-parse HEAD && ls include/llama.h CMakeLists.txt)

      - name: Ensure Gradle wrapper
        working-directory: android
        run: |
          set -euo pipefail
          if [ ! -f gradlew ]; then
            curl -fsSL -o /tmp/gradle-8.7-bin.zip \
              https://services.gradle.org/distributions/gradle-8.7-bin.zip
            unzip -q /tmp/gradle-8.7-bin.zip -d /tmp
            /tmp/gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew
          ./gradlew --version

      - name: Build debug APK (arm64-v8a)
        working-directory: android
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_HOME }}
        run: |
          set -euo pipefail
          ./gradlew :app:assembleDebug --stacktrace --no-daemon \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=512m"

      - name: Locate and stage APK
        shell: bash
        run: |
          set -euo pipefail
          APK=""
          # 1) Explicit canonical names first
          for candidate in \
            "android/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk" \
            "android/app/build/outputs/apk/debug/app-debug.apk"; do
            if [ -f "$candidate" ]; then APK="$candidate"; break; fi
          done
          # 2) ABI-split arm64-v8a
          if [ -z "$APK" ]; then
            APK=$(find android -path '*/outputs/apk/debug/*' -name '*arm64*-debug.apk' -type f 2>/dev/null | head -1 || true)
          fi
          # 3) Any debug APK
          if [ -z "$APK" ]; then
            APK=$(find android -path '*/outputs/apk/debug/*' -name '*.apk' -type f 2>/dev/null | head -1 || true)
          fi
          # 4) Anywhere
          if [ -z "$APK" ]; then
            APK=$(find android -path '*/outputs/apk/*' -name '*.apk' -type f 2>/dev/null | head -1 || true)
          fi
          if [ -z "$APK" ]; then
            echo "::error::No APK found under android/**/outputs/apk"
            find android -name '*.apk' -type f || true
            find android -name 'libathuex*' -type f || true
            exit 1
          fi
          echo "Found: ${APK}"
          ls -lh "${APK}"
          cp "${APK}" "athuex-v${ATHUEX_VERSION}-debug.apk"
          ls -lh "athuex-v${ATHUEX_VERSION}-debug.apk"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: athuex-v${{ steps.version.outputs.version }}-debug-apk
          path: athuex-v${{ steps.version.outputs.version }}-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        run: |
          echo "### Athuex v${ATHUEX_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact: \`athuex-v${ATHUEX_VERSION}-debug.apk\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- ABI: arm64-v8a" >> "$GITHUB_STEP_SUMMARY"
          echo "- NDK: ${NDK_VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "- llama.cpp: shallow clone of \`${LLAMA_GIT_REF}\` in CI (not in git)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Version source: \`android/app/build.gradle[.kts]\` → \`versionName\`" >> "$GITHUB_STEP_SUMMARY"